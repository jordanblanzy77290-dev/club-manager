<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://www.gstatic.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-src https://club-manager-6301b.firebaseapp.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Club Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Mise en page : bandeau noir du club et onglets, puis feuilles de tableaux façon tableur (une colonne par tour, étiquettes colorées par tour) */
:root{
  --bg:#f2f0f0;--surface:#ffffff;--sunk:#f7f5f5;--ink:#191517;--mut:#686264;--line:#e1dcdd;
  --red:#c8102e;--red-ink:#a30c25;--red-soft:#fbe6e9;--on-red:#ffffff;
  --band:#151214;--on-band:#f6f2f3;--band-mut:#b9b0b3;--band-line:rgba(255,255,255,.3);
  --ok:#17784a;--warn:#a75400;--bad:#b3261e;--veil:rgba(12,8,10,.55);--wus:#fdf1e6;
  --t1:#f5c518;--t2:#21bcd2;--t3:#d33bc6;--t4:#7b3fd6;--t5:#ef7b17;--t6:#1e9a5a;--tk:#151214;--tw:#ffffff;
  --shadow:0 1px 2px rgba(20,10,12,.06),0 6px 18px rgba(20,10,12,.05);
  --f-disp:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --rad:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d0e;--surface:#1b1819;--sunk:#151213;--ink:#f2eeef;--mut:#a59fa1;--line:#332d2f;--red:#e1283f;--red-ink:#ff7487;--red-soft:#3b151b;--on-red:#ffffff;--band:#050405;--on-band:#f6f2f3;--band-mut:#a79ea1;--ok:#46c483;--warn:#f0a446;--bad:#ff7b72;--veil:rgba(0,0,0,.7);--wus:#2e1d10;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0d0e;--surface:#1b1819;--sunk:#151213;--ink:#f2eeef;--mut:#a59fa1;--line:#332d2f;--red:#e1283f;--red-ink:#ff7487;--red-soft:#3b151b;--on-red:#ffffff;--band:#050405;--on-band:#f6f2f3;--band-mut:#a79ea1;--ok:#46c483;--warn:#f0a446;--bad:#ff7b72;--veil:rgba(0,0,0,.7);--wus:#2e1d10;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{text-wrap:balance}
.m{color:var(--mut);font-size:13.5px}
.top{background:var(--band);color:var(--on-band)}
.top .in{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.hact{margin-left:auto;display:flex;gap:8px}
.hb{font:600 13.5px/1 var(--f-body);color:var(--on-band);background:transparent;border:1px solid var(--band-line);border-radius:8px;padding:9px 12px;cursor:pointer;white-space:nowrap}
.hb:hover,.hb:focus-visible{border-color:var(--on-band);outline:none}
.top img{height:56px;width:auto;display:block}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand b{font:800 28px/.95 var(--f-disp);letter-spacing:.03em;text-transform:uppercase}
.brand span{font:600 12.5px/1 var(--f-cond);letter-spacing:.16em;text-transform:uppercase;color:var(--band-mut)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);border-bottom:4px solid var(--red)}
.tabs .in{max-width:1240px;margin:0 auto;padding-inline:8px;display:flex;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;background:none;border:0;color:var(--band-mut);font:800 15.5px/1 var(--f-disp);letter-spacing:.02em;text-transform:uppercase;padding:13px 8px 11px;cursor:pointer;border-bottom:3px solid transparent}
#t_j{margin-left:10px;box-shadow:inset 1px 0 0 var(--band-line)}
@media (min-width:900px){.tabs .in{flex-wrap:wrap}}
.tabs button:hover{color:var(--on-band)}
.tabs button.on{color:var(--on-band);border-bottom-color:var(--on-band)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 72px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:16px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:10px}
.eyebrow{font:700 12.5px/1 var(--f-cond);letter-spacing:.16em;text-transform:uppercase;color:var(--red-ink)}
h2{font:800 36px/1 var(--f-disp);letter-spacing:.01em;text-transform:uppercase}
h3{font:700 19px/1.1 var(--f-cond);letter-spacing:.03em;text-transform:uppercase}
h4{font:700 14px/1.2 var(--f-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.ph>div:first-child{display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.end{justify-content:flex-end}
.btn{font:600 14px/1 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.lk{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--red-ink);cursor:pointer;text-align:left}
.lk:hover,.lk.ul{text-decoration:underline}
.lk.ul{text-underline-offset:2px}
:is(.btn,.lk,.cat,.x,.mx,.ck,input,select,textarea,summary,.tabs button):focus-visible{outline:2px solid var(--red);outline-offset:2px}
input,select,textarea{font:500 14.5px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
label.row{gap:6px;font-weight:600;font-size:14px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;min-width:0}
.cat{flex:none;font:600 15px/1 var(--f-cond);letter-spacing:.02em;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.cat i{font-style:normal;font-variant-numeric:tabular-nums;background:var(--sunk);color:var(--mut);border-radius:999px;padding:2px 7px;font-size:12.5px}
.cat.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.cat.on i{background:var(--red);color:var(--on-red)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px/1 var(--f-cond);letter-spacing:.05em;text-transform:uppercase;padding:7px 9px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.chip.hot{background:var(--red-soft);border-color:transparent;color:var(--red-ink)}
.fold{scroll-margin-top:72px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);min-width:0}
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;font:700 17px/1 var(--f-cond);letter-spacing:.04em;text-transform:uppercase}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-45deg);transition:transform .15s;flex:none}
.fold[open]>summary::before{transform:rotate(45deg)}
.fold>summary .cnt{margin-left:auto;font:500 13.5px var(--f-body);text-transform:none;letter-spacing:0;color:var(--mut)}
.fb{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ents{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.ent{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 8px;border:1px solid var(--line);border-radius:8px;min-width:0}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb{flex:none;font:700 13px/1 var(--f-cond);font-variant-numeric:tabular-nums;min-width:40px;text-align:center;padding:5px 6px;border-radius:6px;background:var(--ink);color:var(--surface)}
.rb.new{background:var(--red-soft);color:var(--red-ink)}
.x{flex:none;background:none;border:0;color:var(--mut);cursor:pointer;font-size:15px;line-height:1;padding:6px 8px;border-radius:6px}
.x:hover{color:var(--red-ink);background:var(--red-soft)}
.tbl{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font:700 12.5px/1.2 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.testbar{background:#ffd54a;color:#151214;border-radius:var(--rad);padding:10px 14px;margin-bottom:14px;font-size:14.5px}.testbar summary{cursor:pointer;font-weight:600;margin-top:6px}.testbar .row{margin-top:8px;flex-wrap:wrap}.testbar .m{color:#3d3527}.testbar input,.testbar select{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:10px;width:max-content;max-width:min(560px,calc(100vw - 32px));font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.25)}
/* feuilles de tableau */
.sheets{display:flex;flex-direction:column;gap:16px;min-width:0}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;box-shadow:var(--shadow);break-inside:avoid;min-width:0}
.sh{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;padding:10px 14px}
.sh h3{font:800 25px/1 var(--f-disp);letter-spacing:.04em}
.sh .sub{font:600 14.5px var(--f-cond);letter-spacing:.04em;opacity:.88}
.sh .st{margin-left:auto;font:600 13px var(--f-cond);letter-spacing:.07em;text-transform:uppercase;opacity:.88}
.sb{overflow-x:auto}
.grid{display:grid;column-gap:4px;padding:10px;min-width:max-content}
/* tableaux à la taille du texte : aucune colonne ne coupe un nom ; l'écran entier est utilisé, et fitG() réduit le tableau s'il dépasse */
.wide .wrap{max-width:none}
.tree{grid-template-columns:minmax(max-content,1.25fr) repeat(3,44px minmax(max-content,1fr)) minmax(max-content,1fr);grid-template-rows:auto repeat(8,40px)}
.tree .colh,.grid.pool .colh,.tnt4 .colh,.tnt8 .colh{width:0;min-width:100%}
.sb>.tree,.sb>.grid.pool,.sb>.tnt4,.sb>.tnt8{min-width:0}
/* mesure de la largeur utile (fitG) : colonnes réduites au texte */
.tree.mz{grid-template-columns:max-content repeat(3,44px max-content) max-content}
.grid.pool.mz{grid-template-columns:max-content max-content}.grid.pool.mz .mgrid{grid-template-columns:repeat(3,max-content)}
.tnt4.mz{grid-template-columns:24px max-content repeat(2,max-content) max-content}.tnt8.mz{grid-template-columns:24px max-content repeat(3,max-content) max-content}
.tree .nm,.grid.pool .nm,.tnt4 .nm,.tnt8 .nm,.mgrid .nm{white-space:nowrap;overflow:visible;text-overflow:clip;flex:none}
.tree .pc,.tree .cl,.tree .pl{font-size:13.5px}
.tree .pc,.tree .cl{padding-right:4px}
.tree .pc{padding-left:6px}
.tree .pc .sub{flex:none;font-size:12px}
.colh{font:700 14px/1.1 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;padding:7px 8px 8px;background:var(--sunk);border-top:4px solid var(--tc,var(--ink));border-radius:4px 4px 0 0;margin-bottom:6px}
.colh small{display:block;margin-top:3px;font:500 12.5px var(--f-body);letter-spacing:0;text-transform:none;color:var(--mut)}
.pc,.seed,.cl{display:flex;align-items:center;gap:8px;min-width:0;border-bottom:1px solid var(--line);font-size:14px}
.pc .m{flex:none;font-size:12.5px}
.seed{justify-content:center;font:700 13px var(--f-cond);color:var(--mut);font-variant-numeric:tabular-nums}
.cl b{font:800 19px/1 var(--f-disp);width:28px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.lab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;font:600 11px/1.15 var(--f-cond);letter-spacing:0;border-radius:5px;margin-block:3px;padding:4px 3px;overflow:hidden;overflow-wrap:anywhere;hyphens:auto}
.lab b{font-weight:700;font-size:12px}
.mb{position:relative;margin-block:3px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:grid;grid-template-rows:1fr 14px 1fr;min-width:0}
.mb.ready{border-color:var(--ink)}
.mb.pool{display:flex;flex-direction:column;margin:0}
.mb.pool .pl{min-height:34px}
.pl{display:flex;align-items:center;gap:7px;padding:0 8px;min-width:0;font-size:14px}
.pl .rk{font:600 12.5px/1 var(--f-cond);color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.rk .up,.mv.up{color:var(--ok)}
.rk .dn,.mv.dn{color:var(--bad)}
.pl.win{background:var(--red-soft);font-weight:700;border-radius:7px}
.pl.lose .nm{color:var(--mut)}
.pl.tbd .nm,.pl.bye .nm{color:var(--mut);font-style:italic;font-size:13px}
.vs{position:relative;display:flex;align-items:center;gap:6px;padding:0 8px;min-height:14px;font:700 10.5px/1 var(--f-cond);letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.vs i{flex:1;height:1px;background:var(--line)}
.vs .tg{color:var(--warn)}
.ck{width:17px;height:17px;margin:0;accent-color:var(--red);cursor:pointer;flex:none}
.ck:disabled{cursor:default;opacity:.4}
.ck:checked:disabled{opacity:1}
.ck0{width:17px;flex:none}
.cb{width:14px;height:14px;border:1.5px solid var(--ink);border-radius:3px;flex:none;display:inline-grid;place-items:center;font-size:11px;line-height:1;font-weight:800}
.cb.on::after{content:"✓"}
.mx.ed{opacity:.6;font-size:13px}.mx.ed:hover{opacity:1}
.mx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:700 15px/1 var(--f-body);display:grid;place-items:center;padding:0;z-index:1}
.mx:hover{border-color:var(--ink)}
.grid.pool{grid-template-columns:minmax(max-content,2.2fr) minmax(max-content,1fr);row-gap:0;align-items:start}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(max-content,1fr));gap:8px}.mgrid.t3{align-items:start}.mgrid .tcol{display:grid;gap:8px;align-content:start}.mgrid .tch{font:700 13px/1.2 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;border-top:4px solid var(--tc);padding:6px 2px 0}.mgrid .tch small{display:block;font-weight:500;letter-spacing:0;text-transform:none;color:var(--mut)}
.mgrid>.mb{min-width:0;overflow:hidden}
.stack{display:flex;flex-direction:column;gap:8px;min-width:0}
.pp{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);min-width:0;font-size:14px}
.scr{display:flex;gap:6px;padding:6px 8px 8px;border-top:1px dashed var(--line)}
.scr input{flex:1;min-width:0;width:0;padding:6px 8px;font-size:13.5px}
.scr.wr{align-items:flex-end;font:600 12px var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:12px 8px 8px}.scr.wr i{flex:1;border-bottom:1px solid var(--mut)}
.scr.done{font:700 14px var(--f-cond);letter-spacing:.05em;justify-content:center;padding:6px 8px}
.mini{font-size:13.5px}
.mini td,.mini th{padding:5px 6px}
/* dialogues */
.ov{position:fixed;inset:0;z-index:50;background:var(--veil);display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);color:var(--ink);border-radius:14px;width:min(540px,100%);max-height:calc(100% - 8px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;border-top:5px solid var(--red)}
.dlg h3 span{color:var(--mut)}
.dsec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
/* retardataire : placement en touchant le tableau du Tour 1 */
.lts{display:flex;align-items:center;gap:8px;font:700 13px/1.2 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-top:4px}
.lts i{font-style:normal;flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--red);color:var(--on-red);font:800 12px/1 var(--f-body)}
.lth{font-size:13.5px;color:var(--mut)}
.ltg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}
.ltc{background:var(--sunk);border:1px solid var(--line);border-radius:var(--rad);padding:9px 10px 6px}
.ltc h5{margin:0 0 4px;font:800 15px/1 var(--f-disp);letter-spacing:.04em;text-transform:uppercase}
.ltm{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;padding:5px 0;border-top:1px dashed var(--line)}
.ltc h5+.ltm{border-top:0}
.ltm>span{font:700 11px/1 var(--f-cond);color:var(--mut);text-transform:uppercase}
.ltp{min-width:0;min-height:40px;display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--surface);color:var(--ink);font:500 13px/1.25 var(--f-body);text-align:left;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.ltp:hover:not([disabled]),.ltp:focus-visible{border-color:var(--ink);outline:none;transform:translateY(-1px)}
.ltp>b{flex:none;font:700 11.5px/1 var(--f-cond);color:var(--mut)}
.ltp>span{min-width:0;display:flex;flex-direction:column}
.ltp>span>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltp em{font:700 10px/1.1 var(--f-cond);letter-spacing:.07em;text-transform:uppercase;font-style:normal;margin-bottom:2px}
.ltp.opp{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}.ltp.opp em{color:var(--red)}
.ltp.new{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface));cursor:default;animation:ltin .35s ease}.ltp.new em{color:var(--ok)}
.ltp.mv{border-color:var(--warn);background:var(--wus);animation:ltin .35s ease}.ltp.mv em{color:var(--warn)}
.ltp.free,.ltp.dest{justify-content:center;border-style:dashed;background:transparent;color:var(--mut);font-size:12.5px}
.ltp.dest{border-color:var(--warn);color:var(--warn)}
.ltp.none{border:0;background:none;cursor:default;justify-content:center;color:var(--mut)}
.ltp[disabled]{opacity:.5;cursor:not-allowed}
@keyframes ltin{from{transform:scale(.93);opacity:.35}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ltp{transition:none;animation:none!important}}
.ltr{position:sticky;bottom:10px;z-index:6;border:1px solid var(--line);border-left:4px solid var(--ok);background:var(--surface);box-shadow:0 6px 24px rgba(20,10,12,.16);border-radius:var(--rad);padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.ltr p{font-size:14px}.ltr .row{margin-top:4px}
.mx.wa{right:38px;font-size:13px}
.mx.wa.sent{border-color:var(--ok)}

function voPlan(ph,seed){const v=S.vo,s=v.ss,cf=v.cfg,ids=s.ids.slice(),pairs=voPairs(s);let z=seed>>>0||1;const rnd=()=>{z=(z*1664525+1013904223)>>>0;return z/4294967296};

 const visited={};if(ph=='R')s.jr.filter(j=>j.ph=='A').forEach(j=>j.cl.forEach(c=>{if(c!=j.host)(visited[c]=visited[c]||new Set).add(j.host)}));
 const lim=T=>T=='W'?cf.we:cf.wk,diff={};pairs.forEach(k=>{const[a,b]=k.split('-').map(Number);diff[k]=ids.filter(h=>Math.max(tt(h,a),tt(h,b))<=cf.we).length});
 let best=null;
 for(let it=0;it<350;it++){const left=new Set(pairs),pl=[],hc={};let guard=0;
  while(left.size&&guard++<60){const cand=[];
   ids.forEach(h=>['S','W'].forEach(T=>{const cap=voCap(voC(h),T);if(!cap)return;const near=ids.filter(x=>x==h||tt(h,x)<=lim(T)),P=[...left].filter(k=>{const[a,b]=k.split('-').map(Number);return near.includes(a)&&near.includes(b)});if(!P.length)return;
    P.sort((x,y)=>diff[x]-diff[y]+(rnd()-.5)*1.5);const sel=[],cnt={},cs=new Set([h]);P.forEach(k=>{if(sel.length>=cap.r)return;const[a,b]=k.split('-').map(Number);if((cnt[a]||0)>=cf.perC||(cnt[b]||0)>=cf.perC)return;if(new Set([...cs,a,b]).size>4)return;/* triangulaire ou quadrangulaire : 4 clubs au plus, hôte compris */cs.add(a);cs.add(b);sel.push(k);cnt[a]=(cnt[a]||0)+1;cnt[b]=(cnt[b]||0)+1});
    const pres=new Set([h,...sel.flatMap(k=>k.split('-').map(Number))]);if(pres.size<3&&left.size>sel.length&&rnd()<.85)return;
    const guests=[...pres].filter(x=>x!=h),cost=guests.reduce((a,g)=>a+tt(h,g),0),rv=guests.filter(g=>visited[g]&&visited[g].has(h)).length;
    cand.push({h,T,sel,pres:[...pres],cost,cap,score:sel.length*30-cost*.8-(hc[h]||0)*9-rv*25-(pres.size<3?35:0)+(T=='S'?4:0)+rnd()*6})}));
   if(!cand.length){const k=[...left][0],[a,b]=k.split('-').map(Number);let h=null,bm=1e9;ids.forEach(x=>{const m=Math.max(tt(x,a),tt(x,b));if(m<bm){bm=m;h=x}});cand.push({h,T:'W',sel:[k],pres:[...new Set([h,a,b])],cost:tt(h,a)+tt(h,b),cap:voCap(voC(h),'W')||{r:1,unk:1},score:0,long:1})}
   const c=cand.sort((x,y)=>y.score-x.score)[0];pl.push(c);c.sel.forEach(k=>left.delete(k));hc[c.h]=(hc[c.h]||0)+1}
  const tot=pl.reduce((a,p)=>a+p.cost,0),mx=Math.max(0,...pl.flatMap(p=>p.pres.map(g=>tt(p.h,g)))),hv=Object.values(hc),imb=hv.length?Math.max(...hv)-Math.min(...hv)+(ids.length-hv.length):0,duo=pl.filter(p=>p.pres.length<3).length,lg=pl.filter(p=>p.long).length,
   sc=pl.length*45+tot+mx*2+imb*18+duo*70+lg*120+pl.reduce((a,p)=>a+p.pres.filter(g=>g!=p.h&&visited[g]&&visited[g].has(p.h)).length,0)*30;
  if(!left.size&&(!best||sc<best.sc))best={pl,sc,tot,mx,hc,duo,lg,ph}}
 if(best)best.pl.forEach(p=>{const me=p.sel.filter(k=>k.split('-').map(Number).includes(p.h)),ot=p.sel.filter(k=>!me.includes(k));p.sel=[...me,...ot]});/* l'hôte joue d'abord : il ne dispute pas la dernière rencontre */
 return best}

/* ---------- Espace des capitaines en ligne (PRESET.portal, v70, 29/10/2026) ----------
